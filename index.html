<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>El Tesoro del Pizzero</title>
<style>
/* ===================== ESTILOS ===================== */
:root{
  --crema:#fff3dc; --crema2:#f7e2bd; --madera:#c98b52; --madera2:#9a6234; --tomate:#e2553f; --tomate2:#a63a28;
  --queso:#f6c445; --albahaca:#6aa84f; --turquesa:#3fb8af; --rosa:#f28fad; --cafe:#6b3e26; --choco:#3b2418;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f7e2bd;font-family:"Baloo 2","Comic Sans MS","Chalkboard SE","Arial Rounded MT Bold","Trebuchet MS",sans-serif;color:var(--choco);user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.oculto{display:none!important}
.panel{background:var(--crema);border-radius:22px;border:3px dashed #d79a5e;box-shadow:0 0 0 6px var(--crema),0 0 0 10px #b9773f,0 8px 18px rgba(80,40,10,.35)}
.btn{min-width:56px;min-height:56px;border-radius:18px;background:var(--tomate);border:3px dashed var(--crema);box-shadow:0 0 0 4px var(--tomate),0 6px 0 4px var(--tomate2);color:var(--crema);font:inherit;font-size:22px;font-weight:bold;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:6px 12px;touch-action:none}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 4px var(--tomate),0 2px 0 4px var(--tomate2)}
.btn.verde{background:var(--albahaca);box-shadow:0 0 0 4px var(--albahaca),0 6px 0 4px #3f7a30}
.btn.turq{background:var(--turquesa);box-shadow:0 0 0 4px var(--turquesa),0 6px 0 4px #23807a}
.btn.madera{background:var(--madera);box-shadow:0 0 0 4px var(--madera),0 6px 0 4px var(--madera2)}
.btn svg{width:40px;height:40px;pointer-events:none}
.btn.grande{min-width:96px;min-height:84px;border-radius:24px}
.btn.grande svg{width:60px;height:60px}
.late{animation:late 1.1s ease-in-out infinite}
@keyframes late{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#objetivo{position:absolute;left:18px;top:18px;width:104px;height:104px;display:flex;align-items:center;justify-content:center}
#objetivo svg{width:86px;height:86px}
#minimapa{position:absolute;right:18px;top:18px;width:116px;height:116px;padding:6px}
#minimapa canvas{width:100%;height:100%;display:block;border-radius:12px}
#topBtns{position:absolute;top:18px;left:50%;transform:translateX(-50%);display:flex;gap:16px}
#sub{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;max-width:min(680px,calc(100% - 260px));min-height:72px}
#subCara{width:58px;height:58px;flex:none}
#subCara svg{width:58px;height:58px}
#subTxt{font-size:clamp(22px,3.4vw,34px);font-weight:bold;line-height:1.1;color:var(--choco)}
#sub.hablando #subCara{animation:habla .35s ease-in-out infinite}
@keyframes habla{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px) rotate(-4deg)}}
#pad{position:absolute;left:18px;bottom:18px;display:grid;grid-template-columns:repeat(3,66px);grid-template-rows:repeat(2,66px);gap:8px}
#pad .btn{min-width:66px;min-height:66px;padding:0}
#bVolver{position:absolute;left:18px;bottom:18px}
#bMesa{position:absolute;right:18px;bottom:18px}
#bSaltar{position:absolute;right:18px;top:150px}
#teclas{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);padding:14px 18px;display:flex;gap:26px;align-items:center}
#teclas svg{height:96px;width:auto}
#mano{position:fixed;left:0;top:0;width:76px;height:76px;pointer-events:none;z-index:20;transform:translate(-200px,-200px)}
#mano svg{width:76px;height:76px;filter:drop-shadow(0 4px 3px rgba(80,40,10,.4))}
/* Letras de fieltro */
#nombreFieltro{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);display:flex;gap:10px;align-items:center;pointer-events:none;z-index:15}
.letra{display:inline-flex;align-items:center;justify-content:center;min-width:1.05em;height:1.35em;padding:0 .12em;font-size:clamp(46px,9vmin,96px);font-weight:900;color:var(--crema);background:var(--tomate);border-radius:16px;border:4px dashed rgba(255,243,220,.85);box-shadow:0 0 0 6px var(--tomate),0 10px 0 6px var(--tomate2),0 18px 24px rgba(80,40,10,.35);animation:popLetra .45s cubic-bezier(.3,1.8,.5,1) both}
.letra.esp{background:transparent;border:none;box-shadow:none;min-width:.4em}
.fraccion{display:inline-flex;flex-direction:column;align-items:center;margin-left:.35em;font-size:clamp(34px,7vmin,74px);font-weight:900;color:var(--crema);background:var(--turquesa);border-radius:18px;padding:.08em .35em;border:4px dashed rgba(255,243,220,.85);box-shadow:0 0 0 6px var(--turquesa),0 10px 0 6px #23807a;animation:popLetra .5s .5s cubic-bezier(.3,1.8,.5,1) both;line-height:1}
.fraccion i{display:block;width:100%;height:6px;background:var(--crema);border-radius:3px;margin:4px 0}
@keyframes popLetra{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
/* Pantallas */
.pantalla{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
#menu{background:radial-gradient(ellipse at center,rgba(255,243,220,.15),rgba(107,62,38,.45))}
.letrero{background:repeating-linear-gradient(90deg,#c98b52 0 38px,#bf8049 38px 76px);border-radius:26px;padding:16px 28px;box-shadow:0 0 0 6px #9a6234,0 12px 0 6px #7a4a24,0 20px 30px rgba(60,30,10,.45);text-align:center;color:var(--crema);text-shadow:0 4px 0 #7a4a24}
.letrero h1{margin:0;font-size:clamp(34px,6vw,64px);line-height:1}
.caja{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:640px;width:100%}
.filaNombre{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%}
.filaNombre svg{width:56px;height:56px;flex:none}
#nombre{flex:1;min-width:0;font:inherit;font-size:36px;font-weight:bold;padding:8px 16px;border-radius:16px;border:3px dashed #d79a5e;background:#fffaf0;color:var(--choco);outline:none}
#nombre:focus{border-color:var(--tomate)}
#bJugar{min-width:240px;min-height:96px;font-size:44px;border-radius:30px}
#bJugar svg{width:64px;height:64px}
#opciones{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:14px}
#opciones label{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:bold;background:#fffaf0;border-radius:16px;padding:6px 12px;border:3px dashed #d79a5e;cursor:pointer;min-height:56px}
#opciones input{width:30px;height:30px;accent-color:var(--tomate)}
#opciones svg{width:40px;height:40px}
#menuPipo{width:120px;height:120px}
#pausa{background:rgba(107,62,38,.55)}
#pausa .caja{padding:28px}
#resultado{background:rgba(107,62,38,.45);overflow:auto;align-items:flex-start}
#resultado .caja{max-width:820px;padding:22px;margin:auto}
#resNombre{font-size:clamp(30px,5vw,48px);font-weight:900;color:var(--tomate);text-align:center}
.filaRes{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:34px;font-weight:bold}
.filaRes svg{width:52px;height:52px;vertical-align:middle}
#estrellas svg{width:72px;height:72px}
#aprendi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%}
.concepto{background:#fffaf0;border-radius:18px;border:3px dashed #d79a5e;padding:8px;text-align:center;font-weight:bold;font-size:22px}
.concepto svg{width:70px;height:70px}
.concepto .frac{font-size:26px;color:var(--turquesa)}
.puntos{display:flex;gap:4px;justify-content:center;margin-top:4px}
.puntos b{width:16px;height:16px;border-radius:50%;background:#ead2a8;border:2px dashed #c98b52}
.puntos b.si{background:var(--albahaca);border-color:#3f7a30}
#copiaTxt{width:100%;font:inherit;font-size:18px;padding:8px;border-radius:12px;border:3px dashed #d79a5e;background:#fffaf0}
#errorCdn{z-index:50;background:#f7e2bd}
#errorCdn .caja{padding:24px;font-size:22px;text-align:center}
#debug{position:fixed;left:8px;top:140px;z-index:40;background:rgba(255,243,220,.93);border:2px dashed #b9773f;border-radius:10px;padding:8px 10px;font:13px/1.35 monospace;white-space:pre;color:#3b2418;pointer-events:none}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:45;max-width:90vw;max-height:80vh;overflow:auto;font:15px/1.4 monospace;white-space:pre-wrap;padding:16px}
@media (max-width:760px){#sub{max-width:calc(100% - 24px);bottom:96px}#aprendi{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<div id="hud" class="oculto">
  <div id="objetivo" class="panel" title="Objetivo"></div>
  <div id="topBtns"><button id="bPausa" class="btn madera" aria-label="Pausa"></button><button id="bMudo" class="btn madera" aria-label="Sonido"></button></div>
  <div id="minimapa" class="panel"><canvas id="mm" width="128" height="128"></canvas></div>
  <div id="sub" class="panel oculto"><div id="subCara"></div><div id="subTxt"></div><button id="bRepetir" class="btn turq" aria-label="Repetir"></button></div>
  <div id="pad" class="oculto">
    <span></span><button class="btn turq" data-mov="adelante" aria-label="Adelante"></button><span></span>
    <button class="btn turq" data-mov="izq" aria-label="Girar izquierda"></button><button class="btn turq" data-mov="atras" aria-label="Atrás"></button><button class="btn turq" data-mov="der" aria-label="Girar derecha"></button>
  </div>
  <button id="bVolver" class="btn grande madera oculto" aria-label="Volver"></button>
  <button id="bMesa" class="btn grande verde oculto" aria-label="Mesa"></button>
  <button id="bSaltar" class="btn madera oculto" aria-label="Saltar"></button>
  <div id="teclas" class="panel oculto"></div>
</div>
<div id="mano"></div>
<div id="nombreFieltro" class="oculto"></div>

<div id="menu" class="pantalla">
  <div class="caja">
    <div class="letrero"><h1>El Tesoro<br>del Pizzero</h1></div>
    <div id="menuPipo"></div>
    <div class="filaNombre panel"><span id="icoNombre"></span><input id="nombre" maxlength="14" autocomplete="off" placeholder="Tu nombre" aria-label="Tu nombre"></div>
    <button id="bJugar" class="btn verde late"></button>
    <button id="bOpciones" class="btn madera" aria-label="Opciones"></button>
    <div id="opciones" class="panel oculto">
      <label><input type="checkbox" id="oClic"><span id="icoClic"></span>Modo clic</label>
      <label><input type="checkbox" id="oEfectos"><span id="icoEfectos"></span>Menos efectos</label>
      <label><input type="checkbox" id="oVoz" checked><span id="icoVoz"></span>Voz</label>
      <label><input type="checkbox" id="oTercio" checked><span id="icoTercio"></span>Tercio</label>
    </div>
  </div>
</div>

<div id="pausa" class="pantalla oculto">
  <div class="caja panel">
    <div class="letrero"><h1 id="icoPausaGrande"></h1></div>
    <button id="bSeguir" class="btn verde grande" aria-label="Seguir"></button>
    <div style="display:flex;gap:18px"><button id="bMudo2" class="btn madera" aria-label="Sonido"></button><button id="bMenu" class="btn" aria-label="Menú"></button></div>
  </div>
</div>

<div id="resultado" class="pantalla oculto">
  <div class="caja panel">
    <div id="resNombre"></div>
    <div class="filaRes"><span id="resTiempo"></span><span id="estrellas"></span></div>
    <div class="letrero"><h1 style="font-size:clamp(26px,4vw,40px)">Lo que aprendí</h1></div>
    <div id="aprendi"></div>
    <div class="filaRes"><button id="bCopiar" class="btn turq"></button><button id="bOtraVez" class="btn verde"></button></div>
    <textarea id="copiaTxt" class="oculto" rows="2" readonly></textarea>
  </div>
</div>

<div id="errorCdn" class="pantalla oculto">
  <div class="caja panel">
    <b>No se pudo cargar el motor 3D (Three.js).</b>
    <span>Para el docente: este juego necesita internet la primera vez que se abre. Conecte la computadora y pulse "Reintentar".</span>
    <button class="btn verde" onclick="location.reload()">Reintentar</button>
  </div>
</div>
<div id="debug" class="oculto"></div>
<div id="toast" class="panel oculto"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   EL TESORO DEL PIZZERO — juego educativo de fracciones (1.º y 2.º grado)
   Un solo archivo. Three.js r128 desde cdnjs. Sin recursos externos.
   ===================================================================== */
if (!window.THREE) {
  document.getElementById('errorCdn').classList.remove('oculto');
  document.getElementById('menu').classList.add('oculto');
  throw new Error('Three.js no cargó');
}

/* ===================== 1. CONFIG ===================== */
const CONFIG = {
  MESA_W: 2.6, MESA_D: 1.4, MESA_H: 0.95,     // tablero de cada mesa (m)
  PLANO_ALTURA: 0.12,                          // plano invisible de arrastre = mesa + 0.12

  T_ENCAJE: 0.35, T_VOLVER: 0.3, T_CAMARA: 0.8, PITCH_MESA: 40,

  SALA: { x: 6.7, z: 4.7 }, FOV: 60,
  MAX_PARTICULAS: 120, MAX_NODOS: 8, PR_MAX: 1.5, FPS_MIN: 40,
  VOL_MUSICA: 0.06, VOL_SFX: 0.55,
  C: { // paleta cálida, sin negros ni grises puros
    crema: 0xfff3dc, crema2: 0xf7e2bd, madera: 0xc98b52, madera2: 0x9a6234, tomate: 0xe2553f,
    queso: 0xf6c445, queso2: 0xfbd978, albahaca: 0x6aa84f, turquesa: 0x3fb8af, rosa: 0xf28fad,
    cafe: 0x6b3e26, choco: 0x3b2418, corteza: 0xe3a35a, cielo: 0x9fd8ef, ladrillo: 0xc8643c,
    dorado: 0xf2b632, jamon: 0xf4a3a8, champi: 0xe9d6b8, piel: 0xf2c39b, gris: 0xc9b8c4, hoja: 0x58a05a
  }
};
const MESAS = [ // centro (x,z) en mundo y hacia dónde mira el frente (lado de la cámara)
  { nombre: 'práctica', c: [-5.4, 2.4], f: [1, 0], color: 'turquesa' },
  { nombre: 'mostrador', c: [-5.4, -1.9], f: [1, 0], color: 'rosa' },
  { nombre: 'masa', c: [-2.3, -3.7], f: [0, 1], color: 'queso' },
  { nombre: 'horno', c: [2.3, -3.2], f: [0, 1], color: 'tomate' },
  { nombre: 'clientes', c: [5.4, -1.6], f: [-1, 0], color: 'albahaca' },
  { nombre: 'tesoro', c: [5.4, 2.4], f: [-1, 0], color: 'dorado' }
];

/* ===================== 2. CONTENIDO (voz, subtítulo ≤ 4 palabras, ícono) ===================== */
const CONTENIDO = {
  intro1: { quien: 'gino', voz: '¡Hola! Soy Don Gino, el pizzero.', sub: 'Hola, soy Don Gino', icono: 'gino' },
  intro2: { quien: 'gino', voz: 'Escondí un tesoro en mi pizzería.', sub: 'Escondí un tesoro', icono: 'gino' },
  intro3: { quien: 'gino', voz: 'Rompí el mapa en cuatro partes iguales.', sub: 'Mapa en 4 partes', icono: 'mapa' },
  intro4: { quien: 'gino', voz: 'Tú serás mi ayudante. ¡Pipo te va a ayudar!', sub: '¡Eres mi ayudante!', icono: 'gino' },
  pipoHola: { voz: '¡Hola, {n}! Soy Pipo. ¡Sígueme!', sub: '¡Hola, {n}!', icono: 'pipo' },
  tutCaminar: { voz: 'Camina con las flechas, o toca el botón verde.', sub: 'Camina hacia mí', icono: 'pasos' },

  tutHacer: { voz: '¡Ahora tú! Lleva el queso al plato.', sub: '¡Ahora tú!', icono: 'queso' },
  tutToca: { voz: 'También puedes tocar el queso, y luego tocar el plato.', sub: 'Toca queso, toca plato', icono: 'mano' },
  tutBien: { voz: '¡Muy bien! ¡Ya sabes ayudar! Vamos a la primera mesa.', sub: '¡Muy bien!', icono: 'pipo' },
  bien1: { voz: '¡Muy bien!', sub: '¡Muy bien!', icono: 'pipo' },
  bien2: { voz: '¡Genial!', sub: '¡Genial!', icono: 'pipo' },
  bien3: { voz: '¡Lo lograste!', sub: '¡Lo lograste!', icono: 'pipo' },
  bien4: { voz: '¡Bravo!', sub: '¡Bravo!', icono: 'pipo' },
  siguiente: { voz: '¡Vamos a la siguiente mesa!', sub: '¡A la siguiente mesa!', icono: 'pasos' },
  vuelve: { voz: '¡Ven, {n}! Es por aquí.', sub: '¡Es por aquí!', icono: 'pasos' },
  errGrande: { voz: 'Mira. Ese pedazo es más grande. ¡Prueba otro!', sub: 'Es más grande', icono: 'ojo' },

  e1Intro: { voz: 'Don Gino solo guarda pizzas con partes iguales.', sub: 'Partes iguales', icono: 'iguales' },

  e2Intro: { voz: 'Hay que partir esta pizza por la mitad.', sub: 'Partir por la mitad', icono: 'mitad' },

const VOZ = { ok: false, voz: null };
function prepararVoz() {
  if (!('speechSynthesis' in window)) return;
  const elegir = () => {
    try {
      const vs = speechSynthesis.getVoices();
      VOZ.voz = vs.find((v) => /^es[-_]PE/i.test(v.lang)) || vs.find((v) => /^es[-_]ES/i.test(v.lang)) ||
        vs.find((v) => /^es[-_](US|MX|419)/i.test(v.lang)) || vs.find((v) => /^es/i.test(v.lang)) || null;
      VOZ.ok = !!VOZ.voz;

}

  if (!G.opc.voz || !VOZ.ok || G.mudo) return false;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.voice = VOZ.voz; u.lang = VOZ.voz.lang;
    u.pitch = quien === 'gino' ? 0.7 : quien === 'raton' ? 1.7 : 1.3;
    u.rate = quien === 'gino' ? 0.88 : 0.95; u.volume = 1;

  sonar('plop');
  await animarP(0.9, (k) => fases.forEach((f) => {

function spritePedido(ang) {

    x.fillStyle = '#e3a35a'; x.beginPath(); x.arc(64, 64, 52, 0, TAU); x.fill();

}

}
function dibujarMinimapa(nuevo) {
  const cv = $('mm'), x = cv.getContext('2d');
  x.fillStyle = '#fbecd2'; x.fillRect(0, 0, 128, 128);
  for (let q = 0; q < 4; q++) {
    const dx = (q % 2) * 64, dy = q < 2 ? 0 : 64;

  x.strokeRect(2, 2, 124, 124); x.beginPath(); x.moveTo(64, 0); x.lineTo(64, 128); x.moveTo(0, 64); x.lineTo(128, 64); x.stroke(); x.setLineDash([]);
  if (nuevo != null) { const el = $('minimapa'); el.classList.add('late'); setTimeout(() => el.classList.remove('late'), 2200); }
}
function pintarBotonesMudo() { const h = G.mudo ? ICO.mudo() : ICO.sonido(); $('bMudo').innerHTML = h; $('bMudo2').innerHTML = h; }
function togglePausa(v) {
  if (G.estado === 'MENU' || G.estado === 'RESULTADO') return;
  const nuevo = v == null ? !G.pausa : v; if (nuevo === G.pausa) return;
  G.pausa = nuevo;
  if (G.pausa) { G.estadoPrevio = G.estado; G.estado = 'PAUSA'; cancelarArrastre(); try { speechSynthesis.cancel(); } catch (e) { } }
  else { G.estado = G.estadoPrevio || G.estado; }

}
function prepararUI() {
  $('bJugar').innerHTML = ICO.play() + ' JUGAR';

  $('icoClic').innerHTML = ICO.clic(); $('icoEfectos').innerHTML = ICO.efectos(); $('icoVoz').innerHTML = ICO.vozIco(); $('icoTercio').innerHTML = ICO.tercio();
  $('bPausa').innerHTML = ICO.pausa(); pintarBotonesMudo();
  $('bRepetir').innerHTML = ICO.repetir(); $('bVolver').innerHTML = ICO.volver(); $('bMesa').innerHTML = ICO.pasos() + ICO.mesa();
  $('bSaltar').innerHTML = ICO.saltar(); $('icoPausaGrande').innerHTML = ICO.pausa().replace(/#fff3dc/g, '#fff3dc');
  $('bSeguir').innerHTML = ICO.play(); $('bMenu').innerHTML = ICO.casa();
  $('bCopiar').innerHTML = ICO.copiar() + ' Copiar'; $('bOtraVez').innerHTML = ICO.otraVez();
  document.querySelectorAll('#pad [data-mov]').forEach((b) => {

  const clic = (id, fn) => $(id).addEventListener('click', (e) => { e.preventDefault(); fn(); });
  clic('bJugar', jugar); clic('bOpciones', () => $('opciones').classList.toggle('oculto'));
  clic('bVolver', salirMesa); clic('bMesa', irALaMesa); clic('bPausa', () => togglePausa());
  clic('bMudo', () => setMudo(!G.mudo)); clic('bMudo2', () => setMudo(!G.mudo)); clic('bSeguir', () => togglePausa(false));
  clic('bMenu', () => location.reload()); clic('bRepetir', repetirUltimo); clic('bSaltar', saltarIntro);

  $('nombre').addEventListener('keydown', (e) => { if (e.key === 'Enter') jugar(); e.stopPropagation(); });
  // Parámetros del link: ?voz=0&efectos=1&clic=1 (&tercio=0 &debug=1)
  const q = new URLSearchParams(location.search);

  // Teclado
  window.addEventListener('keydown', (e) => {

    if (e.code === 'KeyP') { togglePausa(); return; }
    if (e.code === 'KeyM') { setMudo(!G.mudo); return; }
    if (G.debug && e.code === 'KeyG') { $('debug').classList.toggle('oculto'); return; }
    if (G.debug && e.code === 'KeyT') { autotest(); return; }

    if (G.modo === 'caminar' && !G.pausa) { TECLAS[e.code] = true; if (/Key[WASD]|Arrow/.test(e.code)) JUG.auto = false; }
  });
  window.addEventListener('keyup', (e) => { TECLAS[e.code] = false; });
  window.addEventListener('blur', () => { cancelarArrastre(); Object.keys(TECLAS).forEach((k) => { TECLAS[k] = false; }); Object.keys(PAD).forEach((k) => { PAD[k] = false; }); });
  // Arrastre sobre el canvas (Pointer Events + captura, touch-action: none)
  canvas.addEventListener('pointerdown', onDown); canvas.addEventListener('pointermove', onMove); canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', () => cancelarArrastre());
  canvas.addEventListener('lostpointercapture', (e) => { if (DR.estado === 'DRAGGING' && e.pointerId === DR.pid) cancelarArrastre(); });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
}
let tRecordar = 0;
function recordatorios() {
  if (G.modo === 'caminar' && G.estacionLista && JUG.quieto > 15 && G.t > tRecordar && !(hablandoHasta > G.t)) {

}
function confetiFrente(n) {

}

/* ===================== 26. PRUEBAS INTEGRADAS (G: depuración, T: autotest, Mayús+N: saltar) ===================== */
let tDebug = 0;
function actualizarDebug(dt) {
  tDebug += dt; if (tDebug < 0.25 || $('debug').classList.contains('oculto')) return; tDebug = 0;
  const p = DR.pieza || DR.sel; let txt = '';
  txt += `estado: ${G.estado}  modo: ${G.modo}  arrastre: ${DR.estado}\n`;
  txt += `paso: ${PASO ? PASO.id + ' (' + PASO.colocados + '/' + PASO.necesarios + ') pista ' + PASO.nivel + ' t=' + PASO.tPista.toFixed(1) : '-'}\n`;
  if (p) {
    aLocal(G.est, p.obj.position.x, p.obj.position.z, _loc);
    let mejor = null, md = Infinity; for (const r of G.ranuras) { if (!r.activa) continue; const d = distRanura(r, p.obj.position.x, p.obj.position.z); if (d < md) { md = d; mejor = r; } }
    txt += `pieza: ${p.id}  mesa x=${_loc.x.toFixed(2)} z=${_loc.z.toFixed(2)}\n`;
    txt += `ranura más cercana: ${mejor ? mejor.id : '-'}  d=${isFinite(md) ? md.toFixed(3) : '-'}  radio=${mejor ? radioEncaje(mejor).toFixed(2) : '-'}\n`;
    const c = findCandidate(p, p.obj.position.x, p.obj.position.z, G.ranuras); txt += `candidata: ${c ? c.id : 'ninguna'}\n`;
  } else txt += 'pieza: -\n';
  const inf = renderer.info.render;
  txt += `fps: ${(G.fps || 0).toFixed(0)}  draw calls: ${inf.calls}  triángulos: ${inf.triangles}  pr: ${G.pr}\n`;
  txt += `pistas: ${G.pistas}  ${Object.keys(G.conceptos).map((k) => k + ' ' + G.conceptos[k].join('/')).join(', ')}`;
  $('debug').textContent = txt;
}
// Autotest: con findCandidate verifica que cada pieza encaja en su ranura correcta y no en una lejana,
// que todo cae dentro de la mesa y de la vista, y que se puede completar solo con toca-y-toca.
function autotest() {
  const planes = G.planes || crearPlanes(), lineas = []; let pass = 0, fail = 0;
  const ok = (c, msg) => { if (c) pass++; else { fail++; lineas.push('FAIL ' + msg); } };
  const res = { tipo: '', ranura: null }, q = new V3();
  planes.forEach((plan, i) => {
    const v = vistaMesa(i); camTmp.position.copy(v.pos); camTmp.quaternion.copy(v.quat); camTmp.updateMatrixWorld();
    const enVista = (x, z, que) => { const w = aMundo(i, x, z, new V3()); q.set(w.x, CONFIG.MESA_H + 0.05, w.z).project(camTmp); ok(Math.abs(q.x) <= 0.95 && q.y > -0.8 && q.y < 0.88, `E${i} ${que} fuera de la vista`); ok(Math.abs(x) <= 1.25 && Math.abs(z) <= 0.66, `E${i} ${que} fuera del tablero`); };
    Object.keys(plan.pasos).forEach((nom) => {
      const def = plan.pasos[nom];
      const ranuras = def.ranuras.map((sp) => {
        const w = aMundo(i, sp.pos[0], sp.pos[1], new V3()); w.y = CONFIG.MESA_H;
        const r = { id: sp.id, centro: w, radius: sp.r, capacidad: sp.cap || 1, items: [], grupo: sp.grupo || sp.id, acceptsType: sp.acepta, llenoEsError: !!sp.lleno, bonus: 0, activa: true };
        r.accepts = (p) => r.acceptsType(p) && r.items.length < r.capacidad; enVista(sp.pos[0], sp.pos[1], 'ranura ' + sp.id); return r;
      });
      def.piezas.forEach((sp) => {
        const w = aMundo(i, sp.home[0], sp.home[1], new V3()), p = { id: sp.id, tipo: sp.tipo, datos: sp.datos || {} };
        enVista(sp.home[0], sp.home[1], 'pieza ' + sp.id);
        ok(findCandidate(p, w.x, w.z, ranuras) === null, `E${i} ${sp.id} encaja estando en su lugar de inicio`);
        if (sp.destinos) {
          sp.destinos.forEach((id) => {
            const r = ranuras.find((x) => x.id === id);
            ok(!!r, `E${i} ${sp.id}: no existe la ranura ${id}`); if (!r) return;
            const d = decidir(p, r.centro.x, r.centro.z, ranuras, res); // toca-y-toca usa exactamente esto
            ok(d.tipo === 'encaja' && sp.destinos.indexOf(d.ranura.id) >= 0, `E${i} ${sp.id} no encaja en ${id} (${d.tipo})`);
            ok(findCandidate(p, r.centro.x, r.centro.z, ranuras) !== null, `E${i} findCandidate(${sp.id}, ${id}) = null`);
            const dx = w.x - r.centro.x, dz = w.z - r.centro.z, l = Math.hypot(dx, dz) || 1, lejos = radioEncaje(r) + 0.12;
            const c2 = findCandidate(p, r.centro.x + dx / l * lejos, r.centro.z + dz / l * lejos, ranuras);
            ok(c2 !== r, `E${i} ${sp.id} encaja en ${id} desde lejos`);
          });
        } else {
          ranuras.forEach((r) => { const d = decidir(p, r.centro.x, r.centro.z, ranuras, res); ok(d.tipo !== 'encaja', `E${i} distractor ${sp.id} encaja en ${r.id}`); });
        }
      });
      // cada ranura necesaria tiene al menos una pieza que la acepta
      const necesarias = def.necesarios;
      const aceptadas = def.piezas.filter((sp) => sp.destinos && ranuras.some((r) => r.acceptsType({ tipo: sp.tipo, datos: sp.datos || {} }))).length;
      ok(aceptadas >= necesarias, `E${i} paso ${def.id}: faltan piezas (${aceptadas}/${necesarias})`);
    });
  });
  // aMundo coincide con el THREE.Group de cada mesa
  MESAS.forEach((m, i) => [[1.3, 0.7], [-1.3, 0.7], [0.4, -0.5]].forEach(([x, z]) => { const a = aMundo(i, x, z, new V3()), b = m.grupo.localToWorld(new V3(x, 0, z)); ok(Math.abs(a.x - b.x) < 1e-9 && Math.abs(a.z - b.z) < 1e-9, `mesa ${i}: local→mundo no coincide con el grupo`); }));
  // Matemática del contenido
  const p1 = planes[1].pasos.e1.piezas;
  p1.forEach((sp) => { const s = sp.datos.partes.reduce((a, b) => a + b, 0), igual = sp.datos.partes.every((x) => x === sp.datos.partes[0]); ok(s === 360, `pizza ${sp.id} no suma 360`); ok(igual === sp.datos.iguales, `pizza ${sp.id} mal clasificada`); });
  planes[5].pedidos.forEach((pd) => { const den = { mitad: 2, tercio: 3, cuarto: 4 }[pd.c]; ok(Math.abs(360 / pd.ang - den) < 1e-9, `pedido ${pd.c} con ${pd.ang}°`); });
  ok(planes[2].pizzas.filter((p) => p.dFrac === 0).length === 1, 'estación 2: debe haber 1 sola línea por el centro');
  ok(Math.abs(centroideSector(PI, 1) - 4 / (3 * PI)) < 1e-9, 'centroide de la mitad');
  // Subtítulos de máximo 4 palabras
  Object.keys(CONTENIDO).forEach((k) => { const n = rellenar(CONTENIDO[k].sub, { n: 'Ana' }).split(/\s+/).filter(Boolean).length; ok(n <= 4, `subtítulo "${k}" tiene ${n} palabras`); });
  const resumen = `${fail ? 'FAIL' : 'PASS'}  (${pass} comprobaciones correctas, ${fail} fallas)`;
  window.__autotest = { pass, fail, lineas, resumen };
  const t = $('toast'); t.textContent = 'AUTOTEST: ' + resumen + (lineas.length ? '\n' + lineas.join('\n') : '\nCada pieza encaja en su ranura correcta y no en una lejana.\nTodo cae dentro de la mesa y de la vista.\nSe puede completar con toca-y-toca.') + '\n\n(clic para cerrar)';
  t.classList.remove('oculto'); t.onclick = () => t.classList.add('oculto');
  console.log('AUTOTEST', resumen, lineas);
  return window.__autotest;
}

/* ===================== 27. GAME LOOP (dt con tope 0.05 s) Y ARRANQUE ===================== */
let ultimo = performance.now(), fpsT = 0, fpsN = 0, bajoT = 0;
function bajarCalidad() {
  if (G.pr > 0.75) { G.pr = Math.max(0.75, G.pr - 0.25); renderer.setPixelRatio(G.pr); renderer.setSize(innerWidth, innerHeight, false); }
  PART.limite = Math.max(30, Math.floor(PART.limite / 2));
}
function loop(ahora) {

  fpsT += real; fpsN++;

    if (!G.pausa && (G.modo === 'caminar' || G.modo === 'mesa')) { bajoT = G.fps < CONFIG.FPS_MIN ? bajoT + 0.5 : 0; if (bajoT >= 3) { bajarCalidad(); bajoT = 0; } }
  }
  if (!G.pausa) {

    actualizarEsperas(); actualizarAnims(dt); actualizarJugador(dt); actualizarPipo(dt);
    actualizarArrastre(dt); actualizarPistas(dt); actualizarParticulas(dt); actualizarDecor(dt); recordatorios();
  }
  renderer.render(scene, camera);
  if (G.debug) actualizarDebug(real);
}

  crearMundo(); crearPersonajes(); crearParticulas(); crearEfectos();
  prepararUI(); prepararVoz(); dibujarMinimapa(); actualizarUI();
  G.modo = 'menu'; PJ.pipo.pos.set(0, 0, 1.2);
  window.__juego = { G, DR, PJ, EST, JUG, renderer, findCandidate, decidir, autotest, saltarEstacion, aMundo, aLocal, get PASO() { return PASO; } };
  if (G.debug) window.__camara = camera;
  requestAnimationFrame(loop);
}
init();
